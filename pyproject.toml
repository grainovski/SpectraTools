# Minimum supported Python for running from source is 3.9. Verified by an
# ast.parse sweep of every tracked source file against the 3.9 grammar: zero
# incompatibilities.
#
# NOTE: this floor is no longer set by the Linux build host. That host built
# against AlmaLinux 8's python39 until v3.1.1, when it moved to python3.12
# (still an el8 package, so the glibc-2.28 floor the build exists for is
# unchanged) because the .mtx decoder is a pure-Python loop and 3.9 ran it
# ~1.6x slower -- see packaging/linux/build.sh. The 3.9 floor is kept here
# only because nothing in the source needs newer syntax; raising it would be
# a deliberate policy change, not a consequence of that build switch. Deliberately recorded as a comment rather than a PEP 621
# `[project]` table -- this app is never pip-installed or built as a wheel
# (PyInstaller consumes it directly), and a `[project]` table would require a
# `version` field, creating a second source of truth that could drift from
# packaging/windows/installer.iss's AppVersion, which is the real one.

[tool.pytest.ini_options]
# Scoped explicitly to tests/ rather than the repo root: pytest's default
# collection walks the whole tree, and packaging/*/output/ (gitignored
# Linux/Windows build artifacts) can contain files a Windows checkout
# can't stat (e.g. Linux .so symlinks), breaking collection entirely once
# a local Linux build has actually been run.
testpaths = ["tests"]
